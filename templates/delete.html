{% extends "base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/delete.css') }}">
{% endblock %}
{% block content %}
<div class="delete-page">
  <h2>Are you sure you want to delete this?</h2>
  <p><b>{{ application.company }}</b> : {{ application.position }}</p>
  <p>This can't be undone!!!</p>


    <form method="POST">
    <button type="submit" class="delete-yes">Yes, delete</button>
  </form>

  <a href="/applications/{{ application._id }}" class="delete-cancel">Cancel</a>
</div>
{% endblock %}
