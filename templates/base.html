<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Jobify</title>
    
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block styles %}{% endblock %}
</head>

<body>
    <header class="app-header">
        <a href="{{ url_for('home') }}" class="logo-link">
            <img
                src="/static/graphics/jobify_logo.svg"
                alt="Jobify"
                class="jobify-logo"
            >
        </a>
    
        {% if current_user.is_authenticated %}
        <div class="profile-menu">
            <button type="button"
                    class="profile-button"
                    id="profile-button"
                    aria-label="Open profile menu"
                    aria-expanded="false"
                    aria-controls="profile-dropdown">
                <img
                    src="{{ url_for('static', filename='graphics/profile.svg') }}"
                    alt=""
                    class="profile-icon"
                >
            </button>
            <div class="profile-dropdown" id="profile-dropdown" hidden>
                <form action="{{ url_for('logout') }}" method="POST">
                    <button type="submit" class="logout-option">
                        Log out
                    </button>
                </form>
            </div>
        </div>
        {% endif %}
    </header>

{% block content %}{% endblock %}

  <nav class="bottom-nav">

        <a href="{{ url_for('home') }}" class="nav-item">
            <img src="/static/graphics/view.svg" alt="" class="nav-icon">
            <span>Applications</span>
        </a>
            <a href="{{ url_for('search') }}" class="nav-item {% if request.endpoint == 'search' %}active{% endif %}">
            <img src="/static/graphics/magnifying_glass.svg" alt="" class="nav-icon">
            <span>Search</span>
        </a>

        <a href="{{ url_for('add_application') }}" class="nav-item">
            <img src="/static/graphics/plus_sign.svg" alt="" class="nav-icon">
            <span>Add</span>
        </a>

    </nav>
    <script>
        const profileButton = document.getElementById("profile-button");
        const profileDropdown = document.getElementById("profile-dropdown");
        if (profileButton && profileDropdown) {
            profileButton.addEventListener("click", function () {
                profileDropdown.hidden = !profileDropdown.hidden;
            });
            document.addEventListener("click", function (event) {
                if (!event.target.closest(".profile-menu")) {
                    profileDropdown.hidden = true;
                }
            });
        }
    </script>
</body>
</html>
