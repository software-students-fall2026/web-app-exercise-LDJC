{% extends "base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add.css') }}">
{% endblock %}

{% block content %}

<div class="mobile-app">

    <header class="add-header">

        <a href="{{ url_for('home') }}" class="back-link">
            <span class="back-arrow">‹</span> Back
        </a>

        <h1>Add Application</h1>

    </header>

    <main class="add-content">

        <p class="required-note">
            <span class="required-star">*</span> Required field
        </p>

        <form method="POST"
              action="{{ url_for('add_application') }}"
              class="add-form">

            <div class="form-group">
                <label for="company">
                    Company name <span class="required-star">*</span>
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    placeholder="e.g. Stripe"
                    required
                >
            </div>

            <div class="form-group">
                <label for="position">
                    Position <span class="required-star">*</span>
                </label>

                <input
                    type="text"
                    id="position"
                    name="position"
                    placeholder="e.g. Software Engineering Intern"
                    required
                >
            </div>

            <div class="form-group">
                <label for="status">Status</label>

                <select id="status" name="status">
                    <option value="Wishlist">Wishlist</option>
                    <option value="Applied">Applied</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>

            <div class="date-row">

                <div class="form-group">
                    <label for="date_applied">
                        Date applied
                    </label>

                    <input
                        type="date"
                        id="date_applied"
                        name="date_applied"
                    >
                </div>

                <div class="form-group">
                    <label for="application_deadline">
                        Application deadline
                    </label>

                    <input
                        type="date"
                        id="application_deadline"
                        name="application_deadline"
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="job_url">
                    Link to job posting
                </label>

                <input
                    type="url"
                    id="job_url"
                    name="job_url"
                    placeholder="https://careers.company.com/job"
                >
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>

                <textarea
                    id="notes"
                    name="notes"
                    placeholder="e.g. Referral from a classmate, interview prep to do"
                    rows="3"
                ></textarea>
            </div>

            <button type="submit" class="save-button">
                Save Application
            </button>

            <a href="{{ url_for('home') }}" class="cancel-link">
                Cancel
            </a>

        </form>

    </main>

    <nav class="bottom-nav">

        <a href="{{ url_for('home') }}" class="nav-item">

            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6"/>
                <line x1="8" y1="12" x2="21" y2="12"/>
                <line x1="8" y1="18" x2="21" y2="18"/>
                <circle cx="3" cy="6" r="1"/>
                <circle cx="3" cy="12" r="1"/>
                <circle cx="3" cy="18" r="1"/>
            </svg>

            <span>Applications</span>
        </a>

        <a href="/search" class="nav-item">

            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16" y1="16" x2="22" y2="22"/>
            </svg>

            <span>Search</span>
        </a>

        <a href="{{ url_for('add_application') }}"
           class="nav-item active">

            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
                <line x1="12" y1="4" x2="12" y2="20"/>
                <line x1="4" y1="12" x2="20" y2="12"/>
            </svg>

            <span>Add</span>
        </a>

    </nav>

</div>

{% endblock %}
