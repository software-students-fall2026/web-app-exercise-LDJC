<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Jobify</title>
    
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block styles %}{% endblock %}
</head>

<body>
{% if request.endpoint != 'add_application' %}
<header class="app-header">
    <a href="{{ url_for('home') }}" class="logo-link">
        <img
            src="/static/graphics/jobify_logo.svg"
            alt="Jobify"
            class="jobify-logo"
        >
    </a>
</header>
{% endif %}

{% block content %}{% endblock %}

  <nav class="bottom-nav">

        <a href="{{ url_for('home') }}" class="nav-item">
            <img src="/static/graphics/view.svg" alt="" class="nav-icon">
            <span>Applications</span>
        </a>

        <a href="{{ url_for('home') }}" class="nav-item">
            <img src="/static/graphics/magnifying_glass.svg" alt="" class="nav-icon">
            <span>Search</span>
        </a>

        <a href="{{ url_for('home') }}" class="nav-item">
            <img src="/static/graphics/plus_sign.svg" alt="" class="nav-icon">
            <span>Add</span>
        </a>

    </nav>

</body>
</html>
